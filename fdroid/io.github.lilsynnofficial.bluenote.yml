AutoName: BlueNote
Summary: Local-first AI Personal Organizer, Habit Tracker, Notes & Second Brain

Description: |-
  BlueNote is a 100% local-first personal productivity workspace and Second Brain.
  All AI features (natural language Brain Dump, OCR receipt & business card scanning,
  note summarization, procedural image/video synthesis, and ambient focus music)
  run completely on-device with zero external API keys required.

  Features:
  * Adaptive Daily Dashboard with Energy Modes (Focused, Busy, Tired, Vacation)
  * 7-Day Weekly Habit Checkmark Grid & 30-Day Streak Trend Visualizations
  * Multi-Intent Natural Language Brain Dump & On-Device OCR Scanner
  * Tasks, Subtasks, Kanban Board & Smart Shopping Checklists
  * Rich Markdown Smart Notes with Folders, Templates & Version History
  * Personal CRM Contacts, Bookmarks & Interactive SVG Knowledge Graph

RepoType: git
Repo: https://github.com/LILSYNNOFFICIAL/BLUENOTE.git

Builds:
  - versionName: 1.0.0-fdroid
    versionCode: 1
    commit: v1.0.0
    subdir: android/app
    sudo:
      - apt-get update
      - apt-get install -y nodejs npm
    init:
      - cd ../..
      - npm ci
      - npm run build
      - mkdir -p android/app/src/main/assets/public
      - cp -r dist/* android/app/src/main/assets/public/
    gradle:
      - fdroid

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 1.0.0-fdroid
CurrentVersionCode: 1
