name: Temporary npm lockfile regeneration

on:
  push:
    branches:
      - security/patch-transitive-npm-advisories

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
          persist-credentials: true
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Regenerate lockfile with npm
        run: npm install --package-lock-only --legacy-peer-deps --no-fund --no-audit
      - name: Verify clean install against regenerated lockfile
        run: npm ci --legacy-peer-deps --ignore-scripts --no-fund --no-audit
      - name: Commit regenerated lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json
          git diff --cached --quiet && { echo "Lockfile already synchronized"; exit 0; }
          git commit -m "chore: synchronize npm lockfile"
          git push origin "HEAD:${{ github.ref_name }}"
