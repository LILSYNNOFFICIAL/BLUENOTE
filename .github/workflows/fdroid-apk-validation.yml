name: F-Droid APK build validation

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/fdroid-apk-validation.yml
      - scripts/build-tesseract-core-fdroid.sh
      - scripts/prepare-local-assets.mjs
      - package.json
      - package-lock.json
      - android/**
      - .fdroid.yml
      - .gitmodules
      - third_party/tesseract.js-core
  pull_request:
    branches:
      - main
    paths:
      - .github/workflows/fdroid-apk-validation.yml
      - scripts/build-tesseract-core-fdroid.sh
      - scripts/prepare-local-assets.mjs
      - package.json
      - package-lock.json
      - android/**
      - .fdroid.yml
      - .gitmodules
      - third_party/tesseract.js-core
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-fdroid-apk:
    name: Source-build OCR and assemble installable test APK
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container: node:22-trixie
    env:
      ANDROID_HOME: /opt/android-sdk
      ANDROID_SDK_ROOT: /opt/android-sdk
    steps:
      - name: Checkout repository and pinned source submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install Debian source-build and Android SDK tools
        run: |
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            ca-certificates git emscripten cmake make build-essential \
            autoconf automake libtool libtool-bin pkg-config sdkmanager

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install Android API 35 and build tools
        run: |
          mkdir -p "$ANDROID_HOME"
          yes | sdkmanager --sdk_root="$ANDROID_HOME" --licenses
          sdkmanager --sdk_root="$ANDROID_HOME" \
            "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Cache npm download store
        uses: actions/cache@v4
        with:
          path: ~/.npm
          key: ${{ runner.os }}-npm-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-npm-

      - name: Install locked JavaScript dependencies
        run: npm ci --legacy-peer-deps --no-fund --no-audit

      - name: Build and sync source-built F-Droid OCR assets
        run: npm run android:sync:fdroid

      - name: Verify local-only OCR bundle
        run: |
          if grep -R -E 'text\\.pollinations\\.ai|\\.hf\\.space|cdn\\.jsdelivr\\.net|fonts\\.googleapis\\.com|identitytoolkit\\.googleapis\\.com|securetoken\\.googleapis\\.com|firestore\\.googleapis\\.com|firebaseapp\\.com' android/app/src/main/assets/public; then
            echo "Unexpected third-party endpoint found in F-Droid web assets." >&2
            exit 1
          fi

      - name: Assemble unsigned F-Droid APK
        run: gradle -p android --no-daemon --stacktrace assembleFdroidRelease

      - name: Verify APK identity and OCR assets
        run: |
          APK=android/app/build/outputs/apk/fdroid/release/app-fdroid-release-unsigned.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='io.github.lilsynnofficial.bluenote' versionCode='7' versionName='1.0.8'"
          test -s android/app/src/main/assets/public/tesseract/core/tesseract-core.wasm
          test -s android/app/src/main/assets/public/tesseract/core/tesseract-core-simd.wasm
          test -s android/app/src/main/assets/public/tesseract/worker.min.js
          test -s android/app/src/main/assets/public/tesseract/lang/eng.traineddata.gz
          sha256sum "$APK"

      # This disposable key is only for direct device testing. F-Droid will
      # rebuild and sign its own release using its own signing infrastructure.
      - name: Sign test APK with temporary debug key
        run: |
          APK=android/app/build/outputs/apk/fdroid/release/app-fdroid-release-unsigned.apk
          SIGNED=android/app/build/outputs/apk/fdroid/release/bluenote-fdroid-1.0.8-test-signed.apk
          KEYSTORE="$RUNNER_TEMP/bluenote-debug-test.keystore"
          keytool -genkeypair -v \
            -keystore "$KEYSTORE" \
            -storepass android -keypass android \
            -alias androiddebugkey -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" sign \
            --ks "$KEYSTORE" --ks-key-alias androiddebugkey \
            --ks-pass pass:android --key-pass pass:android \
            --out "$SIGNED" "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$SIGNED"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$SIGNED" | grep -F "package: name='io.github.lilsynnofficial.bluenote' versionCode='7' versionName='1.0.8'"
          sha256sum "$SIGNED"

      - name: Upload signed test APK
        uses: actions/upload-artifact@v4
        with:
          name: bluenote-fdroid-1.0.8-test-signed
          path: android/app/build/outputs/apk/fdroid/release/bluenote-fdroid-1.0.8-test-signed.apk
          if-no-files-found: error
          retention-days: 14
