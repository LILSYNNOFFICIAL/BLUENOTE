name: GUI visual review

on:
  pull_request:
    paths:
      - "src/**"
      - "index.html"
      - "vite.config.ts"
      - "package.json"
      - "package-lock.json"
      - ".github/workflows/gui-visual-check.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  render-ui:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout PR source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install app dependencies
        run: npm ci

      - name: Build production UI
        run: npm run build

      - name: Install Playwright browser for visual review
        run: |
          npm install --no-save --no-audit --no-fund playwright@1.55.0
          npx playwright install --with-deps chromium

      - name: Capture desktop and mobile workspace screens
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/bluenote-preview.log 2>&1 &
          echo $! > /tmp/bluenote-preview.pid
          for attempt in $(seq 1 60); do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              break
            fi
            sleep 1
          done
          curl --fail --silent http://127.0.0.1:4173/ > /dev/null
          node --input-type=module <<'NODE'
          import { chromium } from 'playwright';
          import fs from 'node:fs';
          import path from 'node:path';

          const out = 'artifacts/gui-visual-review';
          fs.mkdirSync(out, { recursive: true });
          const browser = await chromium.launch({ headless: true });
          const page = await browser.newPage({ viewport: { width: 1440, height: 1000 }, deviceScaleFactor: 1 });
          const consoleErrors = [];
          page.on('pageerror', error => consoleErrors.push('pageerror: ' + error.message));
          page.on('console', message => {
            if (message.type() === 'error') consoleErrors.push('console: ' + message.text());
          });
          await page.goto('http://127.0.0.1:4173/', { waitUntil: 'domcontentloaded', timeout: 60000 });
          await page.locator('.bn-sidebar').waitFor({ state: 'visible', timeout: 60000 });
          await page.waitForTimeout(2500);
          // First launch opens onboarding above the workspace. Dismiss it without saving
          // user data so the screenshot run can inspect the actual workspace screens.
          const skipOnboarding = page.getByRole('button', { name: /Skip Onboarding Guide/i });
          if (await skipOnboarding.count()) {
            await skipOnboarding.click({ timeout: 10000 });
            await page.waitForTimeout(500);
          }

          const sections = [
            ['Dashboard', 'dashboard'],
            ['PROJECTS OS', 'projects-os'],
            ['Universal Inbox', 'inbox'],
            ['Predictive Lists', 'predictive'],
            ['Tasks & Lists', 'tasks'],
            ['Calendar & Planner', 'calendar'],
            ['Smart Notes', 'notes'],
            ['Projects & Goals', 'projects'],
            ['Contacts CRM', 'contacts'],
            ['Saved Links', 'links'],
            ['Files & OCR Vault', 'files'],
            ['Knowledge Graph', 'knowledge-graph'],
            ['Semantic Search', 'semantic-search'],
            ['AI Image Generator', 'ai-image-generator'],
            ['AI Assistant', 'ai-assistant'],
            ['Settings & Themes', 'settings'],
            ['Help & Shortcuts', 'help']
          ];
          const results = [];
          const layoutMetrics = [];
          for (const [label, slug] of sections) {
            const navItem = page.locator('.bn-sidebar button').filter({ hasText: label }).first();
            if (await navItem.count()) {
              await navItem.click();
              await page.waitForTimeout(450);
              await page.screenshot({ path: path.join(out, slug + '-desktop.png'), fullPage: false });
              results.push('desktop ' + slug + ': captured');
              const desktopMetrics = await page.evaluate((section) => {
                const active = document.querySelector('.bn-sidebar .bn-nav-item[data-active="true"]');
                const hero = document.querySelector('.bn-dashboard-hero');
                const activeStyle = active ? getComputedStyle(active) : null;
                return {
                  section, viewport: window.innerWidth,
                  documentWidth: document.documentElement.scrollWidth,
                  activeBackground: activeStyle?.backgroundColor || null,
                  activeBackgroundImage: activeStyle?.backgroundImage || null,
                  activeColor: activeStyle?.color || null,
                  heroWidth: hero?.getBoundingClientRect().width || null
                };
              }, slug);
              layoutMetrics.push({ mode: 'desktop', ...desktopMetrics });
              if (['dashboard', 'tasks', 'calendar', 'notes', 'inbox', 'projects-os', 'settings', 'help'].includes(slug)) {
                await page.setViewportSize({ width: 390, height: 844 });
                await page.waitForTimeout(250);
                await page.screenshot({ path: path.join(out, slug + '-mobile.png'), fullPage: false });
                const mobileMetrics = await page.evaluate((section) => ({
                  section, viewport: window.innerWidth,
                  documentWidth: document.documentElement.scrollWidth,
                  bodyWidth: document.body.scrollWidth,
                  mainClientWidth: document.querySelector('main')?.clientWidth || null,
                  mainScrollWidth: document.querySelector('main')?.scrollWidth || null,
                  heroClientWidth: document.querySelector('.bn-dashboard-hero')?.clientWidth || null,
                  heroScrollWidth: document.querySelector('.bn-dashboard-hero')?.scrollWidth || null
                }), slug);
                layoutMetrics.push({ mode: 'mobile', ...mobileMetrics });
                results.push('mobile ' + slug + ': captured');
                await page.setViewportSize({ width: 1440, height: 1000 });
                await page.waitForTimeout(250);
              }
            } else {
              results.push('skipped ' + slug + ': nav item not found');
            }
          }
          await page.screenshot({ path: path.join(out, 'final-desktop.png'), fullPage: false });
          fs.writeFileSync(path.join(out, 'capture-report.txt'), results.join('\n') + '\n');
          fs.writeFileSync(path.join(out, 'layout-metrics.json'), JSON.stringify(layoutMetrics, null, 2) + '\n');
          fs.writeFileSync(path.join(out, 'browser-errors.txt'), consoleErrors.join('\n') + (consoleErrors.length ? '\n' : 'No uncaught page errors or console errors captured.\n'));
          await browser.close();
          NODE

      - name: Upload visual review screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bluenote-gui-visual-review
          path: artifacts/gui-visual-review/
          if-no-files-found: warn
          retention-days: 7
