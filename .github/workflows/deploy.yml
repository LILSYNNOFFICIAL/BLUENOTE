name: Deploy BlueNote to GitHub Pages

# Scoped strictly to https://github.com/LILSYNNOFFICIAL/BLUENOTE
# Deploys as an isolated Project Page at https://lilsynnofficial.github.io/BLUENOTE/
# Does NOT touch or modify any other GitHub Pages repositories on your account.
on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages-bluenote"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm install

      - name: Build static production bundle (dist/)
        run: npm run build

      - name: Ensure .nojekyll and SPA fallback 404.html in dist
        run: |
          touch dist/.nojekyll
          cp dist/index.html dist/404.html

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: './dist'

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
