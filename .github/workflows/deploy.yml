name: Deploy BlueNote and PR #24 preview to GitHub Pages

on:
  push:
    branches:
      - main
      - master
      - feat/bluenote-workspace-redesign-20261013
  pull_request:
    branches:
      - main
    types: [opened, synchronize, reopened]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # PR preview builds must not cancel the production Pages deployment, or vice versa.
  group: pages-${{ github.event_name == 'pull_request' && 'pr-preview' || 'production' }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    environment:
      name: ${{ github.event_name == 'pull_request' && 'pages-preview-validation' || ((github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master') && 'github-pages' || 'github-pages-preview') }}
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4
        with:
          ref: main
          path: production

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install production dependencies
        working-directory: production
        run: npm install --legacy-peer-deps --no-fund --no-audit

      - name: Build production site
        working-directory: production
        run: |
          npm run build
          cp dist/index.html dist/404.html
          touch dist/.nojekyll

      - name: Install preview dependencies
        working-directory: production
        env:
          PREVIEW_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          git init ../preview-source
          git -C ../preview-source remote add origin https://github.com/LILSYNNOFFICIAL/BLUENOTE.git
          git -C ../preview-source fetch --depth 1 origin "$PREVIEW_SHA"
          git -C ../preview-source checkout --detach FETCH_HEAD
          test "$(git -C ../preview-source rev-parse HEAD)" = "$PREVIEW_SHA"
          npm --prefix ../preview-source install --legacy-peer-deps --no-fund --no-audit

      - name: Build PR preview under /pr-24/
        env:
          PREVIEW_SHA: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: |
          npm --prefix preview-source run build
          mkdir -p production/dist/pr-24
          cp -a preview-source/dist/. production/dist/pr-24/
          test -s production/dist/pr-24/index.html
          test -d production/dist/pr-24/assets
          printf '%s\n' "$PREVIEW_SHA" > production/dist/pr-24/preview-commit.txt
          test "$(cat production/dist/pr-24/preview-commit.txt)" = "$PREVIEW_SHA"
          printf 'Preview files staged at /pr-24/ from commit %s\n' "$PREVIEW_SHA"

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload combined Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages
          path: './production/dist'

      # Pull-request events validate the combined artifact without deployment.
      # A push to the PR branch deploys the preview and records its exact source SHA.
      # Deploy in the same runner job that built and uploaded the artifact.
      - name: Deploy to GitHub Pages
        if: github.event_name != 'pull_request'
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages
          timeout: 10m
