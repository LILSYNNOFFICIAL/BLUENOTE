name: Build BlueNote Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Install Android SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies and sync Android WebView bundle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VITE_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          npm install --legacy-peer-deps --no-fund --no-audit
          npm run android:sync

      - name: Build signed direct-install APK
        working-directory: ./android
        run: gradle assembleFdroidRelease --no-daemon --stacktrace

      - name: Verify APK output
        run: |
          test -n "$(find android/app/build/outputs/apk/fdroid/release -maxdepth 1 -name '*.apk' -print -quit)"
          ls -lh android/app/build/outputs/apk/fdroid/release/*.apk

      - name: Upload BlueNote Android APK
        uses: actions/upload-artifact@v4
        with:
          name: BlueNote-Android-APK
          path: android/app/build/outputs/apk/fdroid/release/*.apk
          if-no-files-found: error
          retention-days: 30
