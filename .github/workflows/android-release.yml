name: Build Android APK & AAB Release (F-Droid & Google Play)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies & sync Android WebView bundle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VITE_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          npm install --no-fund --no-audit
          npm run android:sync

      - name: Build Android APK & Play Store AAB via Gradle
        working-directory: ./android
        run: |
          chmod +x gradlew || true
          gradle assembleRelease assembleDebug bundleRelease --no-daemon

      - name: Upload Android APK (F-Droid / Direct Install)
        uses: actions/upload-artifact@v4
        with:
          name: bluenote-android-apk
          path: |
            android/app/build/outputs/apk/release/*.apk
            android/app/build/outputs/apk/debug/*.apk

      - name: Upload Google Play Store App Bundle (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: bluenote-google-play-aab
          path: android/app/build/outputs/bundle/release/*.aab
