name: Build & Release Android (Firebase + F-Droid)

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Release tag, for example v1.0.1'
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: bluenote-release
  cancel-in-progress: false

jobs:
  android-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact release source
        uses: actions/checkout@v4

      - name: Resolve release tag
        id: release
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            TAG="${GITHUB_REF_NAME}"
          else
            TAG="${{ inputs.release_tag }}"
          fi
          [[ "${TAG}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Setup Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install dependencies
        run: npm install --legacy-peer-deps --no-fund --no-audit

      - name: Build Play Store web bundle
        run: npm run android:sync

      - name: Require Firebase/release signing material
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_KEY_ALIAS"
          mkdir -p "$RUNNER_TEMP/signing"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/signing/bluenote-release.jks"
          test -s "$RUNNER_TEMP/signing/bluenote-release.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/signing/bluenote-release.jks" >> "$GITHUB_ENV"

      - name: Build signed Firebase-login APK + Play bundle
        working-directory: ./android
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          # Normalize the store password without exposing it in logs.
          export ANDROID_KEYSTORE_PASSWORD="$(printf '%s' "$ANDROID_KEYSTORE_PASSWORD" | tr -d '\r\n')"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          gradle assemblePlaystoreRelease bundlePlaystoreRelease --no-daemon

      - name: Build F-Droid local-only APK
        run: npm run android:sync:fdroid

      - name: Build F-Droid APK
        working-directory: ./android
        run: gradle assembleFdroidRelease --no-daemon

      - name: Prepare release assets
        shell: bash
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/playstore/release/*.apk release-assets/bluenote-playstore.apk
          cp android/app/build/outputs/apk/fdroid/release/*.apk release-assets/bluenote-fdroid.apk
          sha256sum release-assets/*.apk > release-assets/SHA256SUMS.txt

      - name: Publish immutable GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release.outputs.tag }}
          target_commitish: ${{ github.sha }}
          name: BlueNote ${{ steps.release.outputs.tag }}
          generate_release_notes: true
          make_latest: true
          files: |
            release-assets/bluenote-playstore.apk
            release-assets/bluenote-fdroid.apk
            release-assets/SHA256SUMS.txt

      - name: Remove signing material
        if: always()
        run: rm -rf "$RUNNER_TEMP/signing"
