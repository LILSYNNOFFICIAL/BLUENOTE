name: Build BlueNote Android APK

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v3
        with:
          gradle-version: '8.9'

      - name: Install Android SDK packages
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Install dependencies and sync Android WebView bundle
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          VITE_GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          npm install --legacy-peer-deps --no-fund --no-audit
          npm run android:sync

      - name: Build signed direct-install APK
        working-directory: ./android
        run: gradle assembleFdroidRelease --no-daemon --stacktrace

      - name: Prepare release APK
        run: |
          mkdir -p release
          APK="$(find android/app/build/outputs/apk/fdroid/release -maxdepth 1 -name '*.apk' -print -quit)"
          test -n "$APK"
          cp "$APK" release/BlueNote.apk
          sha256sum release/BlueNote.apk | tee release/BlueNote.apk.sha256

      - name: Verify APK output
        run: |
          test -s release/BlueNote.apk
          test -s release/BlueNote.apk.sha256
          ls -lh release/BlueNote.apk release/BlueNote.apk.sha256

      - name: Upload BlueNote Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BlueNote-Android-APK
          path: |
            release/BlueNote.apk
            release/BlueNote.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Publish first Android Release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view v1.0.0 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v1.0.0 already exists; skipping bootstrap release."
            exit 0
          fi
          gh release create v1.0.0 \
            release/BlueNote.apk \
            release/BlueNote.apk.sha256 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "BlueNote v1.0.0" \
            --notes "First direct-install Android APK release for BlueNote. Download BlueNote.apk and install it directly on Android." \
            --latest

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "$GITHUB_REF_NAME"             release/BlueNote.apk             release/BlueNote.apk.sha256             --repo "$GITHUB_REPOSITORY"             --title "BlueNote $GITHUB_REF_NAME"             --generate-notes             --latest
