name: Build Android APK & AAB Release (F-Droid & Google Play)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  android-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install dependencies & sync Android WebView bundle (zero server secrets injected)
        run: |
          npm install --no-fund --no-audit
          npm run android:sync

      - name: Build Android APK & Play Store AAB via Gradle
        working-directory: ./android
        run: |
          gradle assembleFdroidRelease assemblePlaystoreRelease assembleDebug bundlePlaystoreRelease --no-daemon

      - name: Prepare direct install APK
        run: |
          mkdir -p release-assets
          cp android/app/build/outputs/apk/fdroid/release/*.apk release-assets/bluenote-android-installable.apk

      - name: Upload Android APK (Direct Install)
        uses: actions/upload-artifact@v4
        with:
          name: bluenote-android-apk
          path: |
            release-assets/bluenote-android-installable.apk
            android/app/build/outputs/apk/*/*/*.apk

      - name: Upload Google Play Store App Bundle (.aab)
        uses: actions/upload-artifact@v4
        with:
          name: bluenote-google-play-aab
          path: android/app/build/outputs/bundle/playstoreRelease/*.aab

      - name: Publish GitHub Release APK assets (on tag or manual dispatch)
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || 'v1.0.0-latest' }}
          name: BlueNote Android APK & Bundle Release
          files: |
            release-assets/bluenote-android-installable.apk
            android/app/build/outputs/bundle/playstoreRelease/*.aab
