name: BlueNote Installable Debug APK

on:
  push:
    branches:
      - feat/bluenote-workspace-redesign-20261013
    paths:
      - .github/workflows/android-debug-apk.yml
      - android/**
      - package.json
      - package-lock.json
      - capacitor.config.ts
      - src/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-fund --no-audit

      - name: Build and sync BlueNote assets
        run: npm run android:sync

      - name: Build installable debug APK
        run: gradle -p android --no-daemon --stacktrace assemblePlaystoreDebug

      - name: Verify APK package, version, and Android signature
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/playstore/debug/app-playstore-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='io.github.lilsynnofficial.bluenote.debug' versionCode='7' versionName='1.0.8'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK"

      - name: Upload installable debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bluenote-1.0.8-installable-debug
          path: android/app/build/outputs/apk/playstore/debug/app-playstore-debug.apk
          if-no-files-found: error
          retention-days: 14
