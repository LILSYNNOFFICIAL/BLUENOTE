name: BlueNote F-Droid-Compatible Debug APK

on:
  push:
    branches:
      - main
      - feat/bluenote-workspace-redesign-20261013
    paths:
      - .github/workflows/android-debug-apk.yml
      - android/**
      - package.json
      - package-lock.json
      - capacitor.config.ts
      - src/**
      - scripts/**
      - .gitmodules
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    steps:
      - name: Checkout source and pinned submodules
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install F-Droid source-build tools
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends emscripten cmake make autoconf automake libtool libtool-bin pkg-config clang llvm
          for tool in emcc emconfigure emmake cmake make autoconf automake libtool pkg-config clang llvm-ar; do
            command -v "$tool"
          done

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install dependencies
        run: npm ci --legacy-peer-deps --no-fund --no-audit

      - name: Build and sync F-Droid-compatible BlueNote assets
        env:
          F_DROID_BUILD: 'true'
        run: npm run android:sync:fdroid

      - name: Build installable F-Droid debug APK
        run: gradle -p android --no-daemon --stacktrace assembleFdroidDebug

      - name: Verify APK package, version, and Android signature
        shell: bash
        run: |
          set -euo pipefail
          APK=android/app/build/outputs/apk/fdroid/debug/app-fdroid-debug.apk
          test -s "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" | grep -F "package: name='io.github.lilsynnofficial.bluenote.debug' versionCode='7' versionName='1.0.8'"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          sha256sum "$APK"

      - name: Upload installable F-Droid debug APK
        uses: actions/upload-artifact@v4
        with:
          name: bluenote-1.0.8-fdroid-compatible-debug
          path: android/app/build/outputs/apk/fdroid/debug/app-fdroid-debug.apk
          if-no-files-found: error
          retention-days: 14
