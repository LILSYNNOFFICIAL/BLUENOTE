name: Verify F-Droid build

on:
  push:
    branches:
      - 'fix/fdroid-review-*'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  fdroid-review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK
        env:
          ANDROID_HOME: /usr/local/lib/android/sdk
        run: |
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | sort -V | tail -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"
      - name: Install locked F-Droid dependencies
        run: npm ci --omit=optional --legacy-peer-deps --no-fund --no-audit
      - name: Build F-Droid web assets
        run: npm run android:sync:fdroid
      - name: Build F-Droid APK
        working-directory: android
        run: gradle assembleFdroidRelease --no-daemon
      - name: Static policy checks
        shell: bash
        run: |
          set -euo pipefail
          test -f android/app/build/outputs/apk/fdroid/release/app-fdroid-release-unsigned.apk
          test -f android/app/src/main/assets/public/tesseract/worker.min.js
          test -f android/app/src/main/assets/public/tesseract/lang/eng.traineddata.gz
          test -f android/app/src/main/assets/public/tesseract/core/tesseract-core.wasm.js
          if grep -RniE 'identitytoolkit\.googleapis\.com|securetoken\.googleapis\.com|firestore\.googleapis\.com|firebaseapp\.com|text\.pollinations\.ai|hf\.space|cdn\.jsdelivr\.net|fonts\.googleapis\.com' android/app/src/main/assets/public; then
            echo "Forbidden remote F-Droid endpoint found in web assets."
            exit 1
          fi
          if grep -RniE 'AIza[0-9A-Za-z_-]{20,}' android/app/src/main/assets/public; then
            echo "Firebase API key found in F-Droid web assets."
            exit 1
          fi
      - name: Inspect APK contents
        shell: bash
        run: |
          set -euo pipefail
          APK="android/app/build/outputs/apk/fdroid/release/app-fdroid-release-unsigned.apk"
          unzip -l "$APK" > apk-contents.txt
          grep -q 'assets/public/tesseract/worker.min.js' apk-contents.txt
          grep -q 'assets/public/tesseract/lang/eng.traineddata.gz' apk-contents.txt
          grep -q 'assets/public/tesseract/core/tesseract-core.wasm.js' apk-contents.txt
      - name: Upload verification artifacts
        uses: actions/upload-artifact@v4
        with:
          name: BlueNote-FDroid-review-${{ github.sha }}
          path: |
            android/app/build/outputs/apk/fdroid/release/app-fdroid-release-unsigned.apk
            apk-contents.txt
          if-no-files-found: error
          retention-days: 14
