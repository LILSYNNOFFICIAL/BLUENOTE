# Embedded F-Droid build recipe for local verification and reproducible packaging.
# Official submissions still belong in fdroiddata; this file makes the upstream
# repository directly buildable with fdroidserver.
Categories:
  - Habit Tracker
  - Note
  - OCR
  - Task
License: Apache-2.0
AntiFeatures:
  - NonFreeNet
AuthorName: LILSYNNOFFICIAL
AuthorWebSite: https://github.com/LILSYNNOFFICIAL/BLUENOTE
SourceCode: https://github.com/LILSYNNOFFICIAL/BLUENOTE
IssueTracker: https://github.com/LILSYNNOFFICIAL/BLUENOTE/issues
WebSite: https://lilsynnofficial.github.io/BLUENOTE/
Changelog: https://github.com/LILSYNNOFFICIAL/BLUENOTE/releases

AutoName: BlueNote
Summary: Local-first organizer with optional cloud account sync

RepoType: git
Repo: https://github.com/LILSYNNOFFICIAL/BLUENOTE.git

Builds:
  - versionName: 1.0.8
    versionCode: 7
    commit: 8081672728184ff58a5c045a17c1e97ae96ead86
    subdir: android/app
    submodules: true
    sudo:
      - apt-get update
      - apt-get install -y nodejs npm emscripten cmake make build-essential autoconf automake libtool libtool-bin pkg-config
    init:
      - cd ../..
      - npm ci --legacy-peer-deps --no-fund --no-audit
      - rm -rf node_modules/firebase node_modules/@google/genai
      - npm run android:sync:fdroid
    scanignore:
      - android/app/src/main/assets/public/tesseract
      - dist/tesseract
      - public/tesseract
    scandelete:
      - node_modules
      - third_party/tesseract.js-core/tesseract-core.wasm
      - third_party/tesseract.js-core/tesseract-core-lstm.wasm
      - third_party/tesseract.js-core/tesseract-core-simd.wasm
      - third_party/tesseract.js-core/tesseract-core-simd-lstm.wasm
      - third_party/tesseract.js-core/tesseract-core-relaxedsimd.wasm
      - third_party/tesseract.js-core/tesseract-core-relaxedsimd-lstm.wasm
    gradle:
      - fdroid
    output: build/outputs/apk/fdroid/release/app-fdroid-release-unsigned.apk

AutoUpdateMode: Version
UpdateCheckMode: Tags
CurrentVersion: 1.0.8
CurrentVersionCode: 7
