apply plugin: 'com.android.application'

android {
    namespace "io.github.lilsynnofficial.bluenote"
    compileSdk rootProject.ext.compileSdkVersion

    defaultConfig {
        applicationId "io.github.lilsynnofficial.bluenote"
        minSdk rootProject.ext.minSdkVersion
        targetSdk rootProject.ext.targetSdkVersion
        versionCode 4
        versionName "1.0.3"
        vectorDrawables.useSupportLibrary = true
    }

    // MANDATORY FOR F-DROID: Disable Google's encrypted dependency metadata block
    // so F-Droid verification servers can validate reproducible open-source APKs.
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }

    signingConfigs {
        release {
            if (System.getenv("ANDROID_KEYSTORE_PATH") != null) {
                storeFile file(System.getenv("ANDROID_KEYSTORE_PATH"))
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                // The release keystore is PKCS12. PKCS12 uses the store password
                // to protect the private key, so no separate key-password secret is needed.
                storeType "PKCS12"
                keyPassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
            }
        }
    }

    flavorDimensions = ["distribution"]
    productFlavors {
        // 1. F-Droid Flavor: 100% FOSS, zero proprietary blobs, reproducible APK.
        // F-Droid must receive an unsigned release APK and sign it itself.
        fdroid {
            dimension "distribution"
            versionNameSuffix "-fdroid"
            buildConfigField "String", "DISTRIBUTION_CHANNEL", '"fdroid"'
        }
        // 2. Google Play Store Flavor: API 35 compliant for Android App Bundle (.aab)
        playstore {
            dimension "distribution"
            buildConfigField "String", "DISTRIBUTION_CHANNEL", '"playstore"'
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'

            // The Firebase/Play Store variant is signed with the persistent release
            // keystore. The F-Droid variant is deliberately left unsigned so F-Droid
            // can apply its own reproducible signing process.
            def requestedTasks = gradle.startParameter.taskNames*.toLowerCase()
            def buildingFdroid = requestedTasks.any { it.contains("fdroid") }

            if (buildingFdroid) {
                // No signingConfig: F-Droid signs the release APK.
            } else if (System.getenv("ANDROID_KEYSTORE_PATH") != null) {
                signingConfig signingConfigs.release
            } else {
                throw new GradleException(
                    "Play Store release signing is required. Configure ANDROID_KEYSTORE_PATH, ANDROID_KEYSTORE_PASSWORD, and ANDROID_KEY_ALIAS."
                )
            }
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

// Keep transitive Kotlin runtime artifacts on one compatible version.
// Some AndroidX dependencies otherwise pull legacy kotlin-stdlib-jdk7/jdk8 jars
// alongside kotlin-stdlib, which AGP rejects as duplicate classes.
configurations.configureEach {
    resolutionStrategy.force(
        "org.jetbrains.kotlin:kotlin-stdlib:1.8.22",
        "org.jetbrains.kotlin:kotlin-stdlib-jdk7:1.8.22",
        "org.jetbrains.kotlin:kotlin-stdlib-jdk8:1.8.22"
    )
}

dependencies {
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.core:core:$androidxCoreVersion"
    implementation "androidx.activity:activity:$androidxActivityVersion"
    implementation "androidx.webkit:webkit:$androidxWebkitVersion"
}
