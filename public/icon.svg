<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Main 3D B Body Gradient (Sky Blue top-left to Deep Cobalt bottom-right) -->
    <linearGradient id="bBodyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4cc9f0" />
      <stop offset="35%" stop-color="#0077ff" />
      <stop offset="75%" stop-color="#0050d5" />
      <stop offset="100%" stop-color="#003399" />
    </linearGradient>

    <!-- Upper Fold / Page-Turn Crease Highlight Gradient -->
    <linearGradient id="bFoldUpper" x1="0%" y1="0%" x2="90%" y2="80%">
      <stop offset="0%" stop-color="#90e0ef" />
      <stop offset="35%" stop-color="#38bdf8" />
      <stop offset="100%" stop-color="#0066eb" />
    </linearGradient>

    <!-- Left Inner Fold Shadow Gradient -->
    <linearGradient id="bInnerFold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#0062ff" />
      <stop offset="100%" stop-color="#002984" />
    </linearGradient>

    <!-- Drop Shadow for Musical Note & Fold -->
    <filter id="softShadow" x="-15%" y="-15%" width="130%" height="130%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#001d5c" flood-opacity="0.38" />
    </filter>
  </defs>

  <!-- Soft outer container card for standalone icon visibility -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="#f8fafc" />

  <!-- THE BLUENOTE "B" EMBLEM -->
  <g transform="translate(24, 10)">
    <!-- Base "B" Silhouette with Upper & Lower Loops -->
    <path
      d="M 110 72
         C 110 54, 124 44, 144 44
         L 256 44
         C 332 44, 382 86, 382 148
         C 382 192, 354 226, 312 240
         C 366 254, 400 294, 400 348
         C 400 416, 344 456, 260 456
         L 144 456
         C 124 456, 110 442, 110 422
         Z"
      fill="url(#bBodyGrad)"
      filter="url(#softShadow)"
    />

    <!-- Left Page-Fold Facet (Diagonal crease from top-left (118,48) to note stem (242,126) and bottom-left) -->
    <path
      d="M 110 72
         C 110 54, 120 46, 134 46
         L 254 126
         L 254 344
         L 124 446
         C 114 440, 110 432, 110 422
         Z"
      fill="url(#bInnerFold)"
    />

    <!-- Top-Right Upper Loop Page-Crease Wing -->
    <path
      d="M 130 44
         L 256 44
         C 332 44, 382 86, 382 148
         C 382 192, 354 226, 312 240
         L 252 240
         L 252 124
         Z"
      fill="url(#bFoldUpper)"
    />

    <!-- White Musical Eighth-Note Cutout (Stem + Diagonal Flag + Tilted Oval Notehead) -->
    <path
      d="M 240 116
         C 258 126, 274 138, 274 156
         L 274 342
         C 274 388, 236 424, 192 424
         C 156 424, 132 398, 132 364
         C 132 324, 168 292, 212 292
         C 223 292, 232 294, 240 298
         Z"
      fill="#ffffff"
      filter="url(#softShadow)"
    />
  </g>
</svg>
